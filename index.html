<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adom Hostel — Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132239;
    --paper:#FFFFFF;
    --paper-2:#F5F4F0;
    --line:#E4E2DA;
    --clay:#8B3A2E;
    --gold:#8A6F3D;
    --pine:#3F5D45;
    --pine-soft:#E7EBE3;
    --clay-soft:#F1E3DE;
    --gold-soft:#F0E9D6;
    --card:#FFFFFF;
    --accent:#12141A;
    --accent-2:#1F3A5F;
    --shadow: 0 1px 0 rgba(19,34,57,0.05);
  }
  /* Deliberately no prefers-color-scheme override: the site always shows this
     light, off-white palette regardless of the visitor's system theme. */
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---- motion primitives ---- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.16,.84,.24,1), transform .7s cubic-bezier(.16,.84,.24,1);}
  .reveal.in-view{opacity:1; transform:translateY(0);}
  .room-grid .reveal:nth-child(1),.kpi-grid .reveal:nth-child(1){transition-delay:0ms;}
  .room-grid .reveal:nth-child(2),.kpi-grid .reveal:nth-child(2){transition-delay:70ms;}
  .room-grid .reveal:nth-child(3),.kpi-grid .reveal:nth-child(3){transition-delay:140ms;}
  .room-grid .reveal:nth-child(4),.kpi-grid .reveal:nth-child(4){transition-delay:210ms;}
  .room-grid .reveal:nth-child(5),.kpi-grid .reveal:nth-child(5){transition-delay:280ms;}
  .room-grid .reveal:nth-child(6),.kpi-grid .reveal:nth-child(6){transition-delay:350ms;}

  #page-content{opacity:0; transform:translateY(10px);}
  #page-content.page-fade-in{opacity:1; transform:translateY(0); transition:opacity .45s cubic-bezier(.16,1,.3,1), transform .45s cubic-bezier(.16,1,.3,1);}

  @keyframes countUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .scroll-progress{
    position:fixed; top:0; left:0; height:2px; width:0%; background:var(--clay);
    z-index:60; transition:width .12s linear; opacity:.8;
  }

  .reveal-scale{opacity:0; transform:translateY(14px) scale(.96); transition:opacity .7s cubic-bezier(.16,.84,.24,1), transform .7s cubic-bezier(.16,.84,.24,1);}
  .reveal-scale.in-view{opacity:1; transform:translateY(0) scale(1);}

  @keyframes modalBgIn{from{opacity:0;} to{opacity:1;}}
  @keyframes modalIn{from{opacity:0; transform:scale(.94) translateY(14px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .modal-bg{animation:modalBgIn .25s ease;}
  .modal{animation:modalIn .4s cubic-bezier(.16,1,.3,1);}

  .room-card{ will-change:transform; }
  .hero-panel{ will-change:transform, opacity; }
  h1,h2,h3,h4{
    font-family:'Newsreader', Georgia, serif;
    font-weight:600;
    line-height:1.15;
    margin:0 0 .4em 0;
    letter-spacing:-0.01em;
  }
  p{line-height:1.55; margin:0 0 1em 0;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  ::selection{background:var(--gold-soft);}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--paper); border-bottom:1px solid transparent;
    transition:box-shadow .35s ease, backdrop-filter .35s ease, border-color .35s ease, background .35s ease;
  }
  .topbar.scrolled{
    border-bottom-color:var(--line);
    box-shadow:0 10px 30px rgba(10,12,14,.05);
    backdrop-filter:saturate(160%) blur(10px);
    background:color-mix(in srgb, var(--paper) 88%, transparent);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; cursor:pointer;}
  .brand-name{font-family:'Newsreader',serif; font-size:1.25rem; font-weight:600;}
  .brand-sub{font-size:.72rem; color:var(--clay); letter-spacing:.03em;}
  .nav{display:flex; gap:22px; align-items:center;}
  .nav a{font-size:.92rem; text-decoration:none; cursor:pointer; color:var(--ink); opacity:.75; padding:4px 0; position:relative; transition:opacity .2s ease;}
  .nav a::after{content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.16,1,.3,1);}
  .nav a:hover{opacity:1;}
  .nav a:hover::after, .nav a.active::after{transform:scaleX(1);}
  .nav a.active{opacity:1;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:7px; border:1px solid transparent;
    font-size:.92rem; font-weight:600; cursor:pointer; text-decoration:none;
    transition:transform .18s cubic-bezier(.16,1,.3,1), opacity .18s ease, box-shadow .25s ease, background .2s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:var(--paper); border-radius:999px;}
  .btn-primary:hover{opacity:.9; transform:translateY(-1px); box-shadow:0 10px 22px rgba(15,17,20,.22);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{background:var(--paper-2); transform:translateY(-1px);}
  .btn-pine{background:var(--pine); color:#fff;}
  .btn-pine:hover{opacity:.94; transform:translateY(-1px); box-shadow:0 10px 22px rgba(20,40,30,.16);}
  .btn-sm{padding:7px 13px; font-size:.82rem;}
  .btn-danger{background:transparent; color:var(--clay); border-color:var(--clay-soft);}
  .btn[disabled]{opacity:.45; cursor:not-allowed; transform:none !important; box-shadow:none !important;}
  .btn-block{width:100%;}

  /* ---- Hero ---- */
  .hero{padding:22px 0 56px;}
  .hero-panel{
    border-radius:28px; padding:56px 48px; position:relative; overflow:hidden;
    background:linear-gradient(135deg, #EFE6D2 0%, #E4DCC6 45%, #DCE3D6 100%);
  }
  .hero-grid{display:block; max-width:600px; position:relative; z-index:1;}
  .eyebrow{font-size:.78rem; color:var(--accent-2); margin-bottom:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;}
  .hero h1{font-size:clamp(2.2rem, 4.2vw, 3.3rem); color:var(--ink);}
  .hero h1 em{font-family:'Newsreader',serif; font-style:italic; font-weight:500;}
  .hero p.lead{font-size:1.08rem; max-width:44ch; color:var(--ink); opacity:.72;}
  .hero-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; align-items:center;}
  .search-pill{
    display:flex; align-items:center; gap:0; background:var(--card); border-radius:999px;
    padding:6px; margin-top:26px; max-width:440px; box-shadow:0 14px 34px rgba(19,34,57,.10);
  }
  .search-pill .sp-field{flex:1; padding:10px 18px; font-size:.92rem; color:var(--ink); opacity:.8;}
  .search-pill button{
    border:none; border-radius:999px; background:var(--accent); color:var(--paper);
    padding:12px 22px; font-size:.88rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px;
    transition:transform .18s cubic-bezier(.16,1,.3,1), opacity .18s ease;
  }
  .search-pill button:hover{opacity:.9; transform:translateY(-1px);}
  .search-pill button svg{width:15px; height:15px;}
  .stat-row{display:flex; gap:40px; margin-top:34px; flex-wrap:wrap; padding-top:28px; border-top:1px solid var(--line);}
  .stat b{font-family:'Newsreader',serif; font-size:1.6rem; display:block;}
  .stat span{font-size:.78rem; opacity:.65;}

  /* ---- sections ---- */
  section{padding:56px 0;}
  section.alt{background:var(--paper-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  .section-head h2{font-size:1.7rem;}
  .section-head p{margin:0; opacity:.7; max-width:44ch;}

  .room-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;}
  .room-carousel{display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 10px; scrollbar-width:none;}
  .room-carousel::-webkit-scrollbar{display:none;}
  .room-carousel .room-card{min-width:270px; max-width:270px; flex:0 0 auto; scroll-snap-align:start;}
  .carousel-nav{display:flex; gap:10px;}
  .carousel-nav button{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink);
    transition:transform .18s cubic-bezier(.16,1,.3,1), background .2s ease, border-color .2s ease;
  }
  .carousel-nav button:hover{transform:translateY(-2px);}
  .carousel-nav button.primary{background:var(--accent); border-color:var(--accent); color:var(--paper);}
  .carousel-nav svg{width:16px; height:16px;}
  .room-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer; transition:box-shadow .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1), border-color .35s ease;
  }
  .room-card:hover{transform:translateY(-4px); box-shadow:0 20px 40px rgba(20,25,30,.10); border-color:transparent;}
  .room-photo{aspect-ratio:16/10; background:var(--paper-2); position:relative; overflow:hidden;}
  .room-photo img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.16,1,.3,1);}
  .room-card:hover .room-photo img{transform:scale(1.06);}
  .room-photo .ph-fallback{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--line);
    background:linear-gradient(120deg, var(--paper-2) 0%, var(--card) 45%, var(--paper-2) 100%);
    background-size:220% 100%;
    animation:phShift 7s ease-in-out infinite;
  }
  .ph-letter{
    font-family:'Newsreader',serif; font-weight:600; font-size:2.8rem; color:var(--line);
    user-select:none;
  }
  @keyframes phShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .badge{
    position:absolute; top:10px; left:10px; padding:4px 10px; border-radius:20px;
    font-size:.72rem; font-weight:600; background:rgba(255,255,255,.92); color:var(--pine);
  }
  .badge.occ{color:var(--clay);}
  .room-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .room-body h3{font-size:1.08rem;}
  .room-meta{font-size:.82rem; opacity:.65;}
  .room-price{margin-top:auto; display:flex; align-items:baseline; justify-content:space-between; padding-top:10px; border-top:1px dashed var(--line);}
  .room-price b{font-family:'Newsreader',serif; font-size:1.3rem;}
  .room-price span{font-size:.78rem; opacity:.6;}

  /* map */
  .map-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:28px;}
  .map-visual{
    border-radius:12px; border:1px solid var(--line); overflow:hidden; background:var(--card);
    aspect-ratio:4/3; position:relative;
  }
  .map-visual svg{width:100%; height:100%;}
  .map-side{display:flex; flex-direction:column; gap:16px;}
  .info-line{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .info-line:last-child{border-bottom:none;}
  .info-line .ico{width:20px; flex-shrink:0; opacity:.6; margin-top:2px;}
  .info-line b{display:block; font-size:.9rem;}
  .info-line span{font-size:.85rem; opacity:.7;}
  .landmark-list{display:flex; flex-direction:column; gap:0;}

  /* Cards / form */
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px; opacity:.8;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:7px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:.94rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .hint{font-size:.78rem; opacity:.6; margin-top:4px;}

  .booking-layout{display:grid; grid-template-columns:1.3fr .9fr; gap:28px; align-items:start;}
  .summary-card{position:sticky; top:90px;}
  .summary-line{display:flex; justify-content:space-between; font-size:.9rem; padding:8px 0; border-bottom:1px solid var(--line);}
  .summary-line.total{border-bottom:none; padding-top:14px; font-size:1.1rem; font-family:'Newsreader',serif;}

  .stepper{display:flex; align-items:center; gap:0; margin-bottom:28px; flex-wrap:wrap;}
  .step{display:flex; align-items:center; gap:10px; flex:1; min-width:140px;}
  .step-dot{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; background:var(--card);
  }
  .step.done .step-dot{background:var(--pine); border-color:var(--pine); color:#fff;}
  .step.current .step-dot{border-color:var(--clay); color:var(--clay);}
  .step-label{font-size:.82rem; font-weight:600;}
  .step.done .step-label{color:var(--pine);}
  .step-line{flex:1; height:2px; background:var(--line); margin:0 4px;}
  .step-line.done{background:var(--pine);}

  .status-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:.78rem; font-weight:600;}
  .status-pending{background:var(--gold-soft); color:var(--gold);}
  .status-payment_uploaded{background:var(--gold-soft); color:var(--gold);}
  .status-approved{background:var(--pine-soft); color:var(--pine);}
  .status-confirmed{background:var(--pine-soft); color:var(--pine);}
  .status-rejected{background:var(--clay-soft); color:var(--clay);}

  .upload-box{
    border:1.5px dashed var(--line); border-radius:10px; padding:26px; text-align:center; cursor:pointer;
    background:var(--paper);
  }
  .upload-box:hover{border-color:var(--gold);}
  .upload-box img{max-width:100%; max-height:180px; border-radius:6px; margin-top:10px;}

  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; opacity:.55; font-weight:600;}
  tr:hover td{background:var(--paper-2);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card);}
  .table-wrap table{margin:0;}
  .table-wrap .table-wrap{border:none;}

  .site-footer{background:var(--ink); color:var(--paper); border-radius:28px; margin:0 24px 24px; overflow:hidden; position:relative;}
  .site-footer-top{max-width:1080px; margin:0 auto; padding:52px 24px 30px; display:flex; justify-content:space-between; gap:40px; flex-wrap:wrap;}
  .site-footer .f-brand{font-family:'Newsreader',serif; font-size:1.3rem; font-weight:600; margin-bottom:8px;}
  .site-footer .f-meta{font-size:.8rem; opacity:.6; margin-bottom:20px;}
  .site-footer .f-social{display:flex; gap:14px;}
  .site-footer .f-social a{
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(247,242,231,.25);
    display:flex; align-items:center; justify-content:center; color:var(--paper); opacity:.85; cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .site-footer .f-social a:hover{background:rgba(247,242,231,.12); transform:translateY(-2px);}
  .site-footer .f-social svg{width:15px; height:15px;}
  .f-cols{display:flex; gap:60px; flex-wrap:wrap;}
  .f-col h4{font-size:.85rem; margin-bottom:14px; opacity:.9;}
  .f-col a{display:block; font-size:.86rem; opacity:.62; margin-bottom:10px; cursor:pointer; text-decoration:none; color:inherit; transition:opacity .2s ease;}
  .f-col a:hover{opacity:1;}
  .f-wordmark{
    font-family:'Newsreader',serif; font-weight:600; font-size:clamp(3.5rem, 13vw, 9rem);
    color:rgba(247,242,231,.06); line-height:1; white-space:nowrap; overflow:hidden;
    padding:0 24px 10px; letter-spacing:-0.02em;
  }

  /* Manager shell */
  .mgr-shell{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 65px);}
  .mgr-side{border-right:1px solid var(--line); padding:22px 14px; background:var(--paper-2);}
  .mgr-side a{
    display:block; padding:9px 12px; border-radius:7px; font-size:.88rem; text-decoration:none; color:var(--ink);
    opacity:.72; margin-bottom:2px; cursor:pointer;
  }
  .mgr-side a:hover{background:var(--paper);}
  .mgr-side a.active{opacity:1; background:var(--card); font-weight:600; box-shadow:var(--shadow);}
  .mgr-main{padding:30px 34px; max-width:1000px;}
  .mgr-main h2{font-size:1.5rem; margin-bottom:4px;}
  .mgr-sub{opacity:.6; font-size:.9rem; margin-bottom:26px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:30px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;}
  .kpi:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(20,25,30,.08);}
  .kpi b{font-family:'Newsreader',serif; font-size:1.9rem; display:block;}
  .kpi span{font-size:.8rem; opacity:.62;}
  .kpi.flag{border-color:var(--clay); background:var(--clay-soft);}

  .pill-tab{display:inline-flex; gap:6px; padding:4px; background:var(--paper-2); border-radius:9px; margin-bottom:18px;}
  .pill-tab button{padding:7px 14px; border-radius:6px; border:none; background:transparent; font-size:.84rem; font-weight:600; cursor:pointer; color:var(--ink); opacity:.6;}
  .pill-tab button.active{background:var(--card); opacity:1; box-shadow:var(--shadow);}

  .filter-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-row select, .filter-row input{padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.84rem;}

  .modal-bg{position:fixed; inset:0; background:rgba(20,20,18,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:var(--card); border-radius:14px; padding:26px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-bottom:14px;}
  .modal-close{float:right; cursor:pointer; opacity:.5; font-size:1.3rem; line-height:1;}

  .sms-log{display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto;}
  .sms-item{background:var(--pine-soft); border-radius:10px; padding:12px 14px; font-size:.84rem;}
  .sms-item b{display:block; font-size:.76rem; color:var(--pine); margin-bottom:3px; font-family:'IBM Plex Mono',monospace;}

  .receipt{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:30px; max-width:520px;}
  .receipt-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:16px;}
  .receipt-row{display:flex; justify-content:space-between; padding:6px 0; font-size:.9rem;}
  .receipt-total{border-top:1px solid var(--line); margin-top:10px; padding-top:12px; display:flex; justify-content:space-between; font-family:'Newsreader',serif; font-size:1.25rem;}

  .empty{padding:40px 20px; text-align:center; opacity:.6; font-size:.9rem;}
  .login-wrap{max-width:380px; margin:80px auto; padding:0 20px;}
  .badge-flag{background:var(--clay); color:#fff; border-radius:10px; padding:1px 7px; font-size:.7rem; margin-left:6px;}

  @media (max-width: 860px){
    .map-grid{grid-template-columns:1fr;}
    .booking-layout{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .mgr-shell{grid-template-columns:1fr;}
    .mgr-side{display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); gap:4px;}
    .mgr-side a{white-space:nowrap;}
    .nav{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     DATA LAYER
  --------------------------------------------------------- */
  const STORE_KEY = "adom_hostel_state_v2";

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addDays(iso, n){ const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
  function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
  function money(n){ return "GHS " + Number(n||0).toLocaleString("en-GH",{minimumFractionDigits:2, maximumFractionDigits:2}); }

  function buildRooms(){
    // Capacity -> price/month (GHS) and a short bed-type label.
    const tiers = {
      1: { price: 1800, bedType: "1 in a room · private ensuite" },
      2: { price: 1150, bedType: "2 in a room · shared twin" },
      4: { price: 650,  bedType: "4 in a room · shared bunks" }
    };
    function describe(floorLabel, no, cap){
      if(cap === 1){
        return `A private room on the ${floorLabel.toLowerCase()}. One resident per room, with an ensuite bathroom, wardrobe, and a reading desk.`;
      }
      if(cap === 2){
        return `A shared room on the ${floorLabel.toLowerCase()}, two residents per room, each with their own bed, wardrobe space, and a shared bathroom down the hall.`;
      }
      return `A shared room on the ${floorLabel.toLowerCase()}, four residents per room in bunk beds, with a wardrobe per bed and a shared reading table.`;
    }
    const floors = [
      { label:"Ground Floor", rooms:[
        {no:"G1",cap:4}, {no:"G2",cap:4}, {no:"G3",cap:2}, {no:"G4",cap:2}, {no:"G5",cap:1}
      ]},
      { label:"1st Floor", rooms:[
        {no:"101",cap:4}, {no:"102",cap:4}, {no:"103",cap:2}, {no:"104",cap:2}, {no:"105",cap:1}, {no:"106",cap:1}
      ]},
      { label:"2nd Floor", rooms:[
        {no:"201",cap:4}, {no:"202",cap:4}, {no:"203",cap:2}, {no:"204",cap:2}, {no:"205",cap:1}, {no:"206",cap:4}
      ]},
      { label:"3rd Floor", rooms:[
        {no:"301",cap:2}, {no:"302",cap:2}, {no:"303",cap:1}, {no:"304",cap:1}, {no:"305",cap:4}
      ]}
    ];
    const rooms = [];
    let i = 0;
    floors.forEach(floor=>{
      floor.rooms.forEach(r=>{
        const tier = tiers[r.cap];
        i++;
        rooms.push({
          id: uid("room"),
          name: `${floor.label} — Room ${r.no}`,
          floor: floor.label,
          roomNo: r.no,
          bedType: tier.bedType,
          price: tier.price,
          period: "month",
          maxOccupants: r.cap,
          status: (i % 4 === 0) ? "occupied" : "available",
          description: describe(floor.label, r.no, r.cap),
          photos: []
        });
      });
    });
    return rooms;
  }

  function seedData(){
    const today = todayISO();
    const rooms = buildRooms();
    const firstOccupied = rooms.find(r=>r.status==="occupied") || rooms[0];

    const bookings = [
      {
        id: uid("bk"), roomId: firstOccupied.id, guestName:"Efua Mensah", phone:"0244 000 111", email:"efua@example.com",
        checkIn: addDays(today,-10), checkOut: addDays(today,4), nights: 14, total: firstOccupied.price, period:"month",
        status:"confirmed", receipt:null, notes:"", createdAt: addDays(today,-11), approvedAt: addDays(today,-10)
      }
    ];

    return {
      info:{
        name:"Adom Hostel",
        tagline:"Student housing, five minutes from Legon Main Gate.",
        address:"12 Adenta Link Road, near Legon Main Gate, Accra, Ghana",
        landmarks:[
          {name:"Legon Main Gate", distance:"5 min walk"},
          {name:"Madina Market", distance:"10 min drive"},
          {name:"Legon Interchange", distance:"7 min drive"},
          {name:"Trotro station (37)", distance:"3 min walk"}
        ],
        mapsQuery:"Legon Main Gate, Accra, Ghana",
        showMap:true, showLandmarks:true, showAddress:true,
        checkoutReminderDays:2
      },
      rooms, bookings, smsLog:[], customerNotes:{}
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    const seeded = seedData();
    save(seeded);
    return seeded;
  }
  function save(state){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.error("storage failed", e); }
  }

  function persist(){ save(state); }

  function renderMiniCalendar(r){
    // simple 14-day strip showing available/occupied for visual only
    const today = todayISO();
    let cells = "";
    for(let i=0;i<14;i++){
      const d = addDays(today, i);
      const occ = r.status === "occupied" && i < 5;
      cells += `<div title="${fmtDate(d)}" style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.68rem;background:${occ?'var(--clay-soft)':'var(--pine-soft)'};color:${occ?'var(--clay)':'var(--pine)'};">${new Date(d+'T00:00:00').getDate()}</div>`;
    }
    return `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">${cells}</div>
      <div style="display:flex; gap:16px; margin-top:10px; font-size:.76rem; opacity:.7;">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--pine-soft);border-radius:3px;margin-right:5px;"></span>Available</span>

  }

  function updateDraft(k,v){ bookingDraft[k]=v; render(); }

  function submitBooking(){
    const r = roomById(bookingDraft.roomId);
    const {checkIn, checkOut, name, phone, email} = bookingDraft;
    if(!checkIn || !checkOut || checkOut <= checkIn){ alert("Please choose a valid check-in and check-out date."); return; }
    if(!name || !phone){ alert("Please enter your name and phone number."); return; }
    const nights = daysBetween(checkIn, checkOut);
    let total;
    if(r.period === "month") total = Math.max(1, Math.ceil(nights/30)) * r.price;
    else if(r.period === "year") total = Math.max(1, Math.ceil(nights/365)) * r.price;
    else total = nights * r.price;

    const booking = {
      id: uid("bk"), roomId:r.id, guestName:name, phone, email,
      checkIn, checkOut, nights, total, period:r.period,
      status:"pending", receipt:null, notes:"", createdAt: todayISO(), approvedAt:null
    };
    state.bookings.unshift(booking);
    sendSMS(phone, `Hi ${name}, your booking for ${r.name} (${fmtDate(checkIn)} - ${fmtDate(checkOut)}) has been received. Total due: ${money(total)}. Reply after payment to confirm.`);
    persist();
    go("payment",{id:booking.id});
  }

  function payWithMomo(id){
    const b = state.bookings.find(x=>x.id===id);
    if(!b) return;
    // simulate paystack momo flow
    b.status = "payment_uploaded";
    sendSMS(b.phone, `We're processing your Mobile Money payment of ${money(b.total)} via Paystack. Please also upload your receipt screenshot.`);
    persist();

  function uploadReceipt(id, input){
    const b = state.bookings.find(x=>x.id===id);
    if(!b || !input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = function(e){
      b.receipt = e.target.result;
      if(b.status === "pending") b.status = "payment_uploaded";
      sendSMS(b.phone, `Thanks — we received your payment screenshot for ${money(b.total)}. The hostel manager will confirm it shortly.`);
      persist();
      render();
    };
    reader.readAsDataURL(input.files[0]);
  }

  function stepper(status){
    const steps = [
      {k:"pending", l:"Pending"},
      {k:"payment_uploaded", l:"Payment received"},
      {k:"approved", l:"Approved"},
      {k:"confirmed", l:"Confirmed"}
    ];
    const order = ["pending","payment_uploaded","approved","confirmed"];
    const idx = status === "rejected" ? -1 : order.indexOf(status);
    return `<div class="stepper">
      ${steps.map((s,i)=>{
        const done = i < idx || status==="confirmed" && i<=idx;
        const isDone = i <= idx && status !== "rejected";
        const isCurrent = i === idx;
        return `<div class="step ${isDone && !isCurrent ? 'done':''} ${isCurrent?'current':''}">
          <div class="step-dot">${isDone && !isCurrent ? '✓' : i+1}</div>
          <div class="step-label">${s.l}</div>
        </div>${i<steps.length-1?`<div class="step-line ${i<idx?'done':''}"></div>`:''}`;
      }).join("")}
    </div>
    ${status==="rejected" ? `<div class="status-pill status-rejected" style="margin-bottom:20px;">Payment rejected — please re-upload or contact the hostel</div>`:""}
    `;
  }

  function pageDashboard(){

    const revenueThisMonth = state.bookings
      .filter(b => (b.status==="confirmed"||b.status==="approved") && (b.approvedAt||"").slice(0,7) === today.slice(0,7))
      .reduce((s,b)=>s+Number(b.total||0),0);

              <td><span class="status-pill status-${b.status}">${statusLabel(b.status)}</span></td>
              <td><button class="btn btn-ghost btn-sm" onclick="App.openBookingReview('${b.id}')">Open</button></td>
            </tr>`;
          }).join("") : `<tr><td colspan="7" class="empty">No bookings match these filters.</td></tr>`}
        </table>
      </div>
      ${reviewModalId ? bookingReviewModal() : ""}
    `);
  }
  function setBookingFilter(k,v){ bookingFilters[k]=v; render(); }
  let reviewModalId = null;
  function openBookingReview(id){ reviewModalId = id; render(); }
  function closeBookingReview(){ reviewModalId = null; render(); }
  function bookingReviewModal(){
    const b = state.bookings.find(x=>x.id===reviewModalId);
    if(!b) return "";
    const r = roomById(b.roomId);
    return `
    <div class="modal-bg" onclick="if(event.target===this){App.closeBookingReview()}">
      <div class="modal">
        <span class="modal-close" onclick="App.closeBookingReview()">&times;</span>
        <h3>${b.guestName} — ${r?r.name:''}</h3>
        <span class="status-pill status-${b.status}">${statusLabel(b.status)}</span>
        <div style="margin:16px 0;">
          <div class="receipt-row"><span>Phone</span><span>${b.phone}</span></div>
          <div class="receipt-row"><span>Email</span><span>${b.email||'—'}</span></div>
          <div class="receipt-row"><span>Dates</span><span>${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}</span></div>
          <div class="receipt-row"><span>Total</span><span>${money(b.total)}</span></div>
        </div>
        ${b.receipt ? `<div class="field"><label>Payment screenshot</label><img src="${b.receipt}" style="max-width:100%; border-radius:8px; border:1px solid var(--line);"></div>` : `<p class="hint">No payment screenshot uploaded yet.</p>`}
        <div class="field"><label>Manager notes</label><textarea id="review-notes" rows="2">${b.notes||''}</textarea></div>
        ${b.status === "payment_uploaded" ? `
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-pine" onclick="App.approvePayment('${b.id}')">Accept payment</button>
            <button class="btn btn-danger" onclick="App.rejectPayment('${b.id}')">Reject payment</button>
          </div>
        `: ""}
        ${b.status === "approved" ? `<button class="btn btn-primary" style="margin-top:10px;" onclick="App.confirmStay('${b.id}')">Confirm stay &amp; assign room</button>` : ""}
        ${b.status === "confirmed" ? receiptView(b, r, true) : ""}
      </div>
    </div>`;
  }
  function approvePayment(id){
    const b = state.bookings.find(x=>x.id===id);
    b.notes = document.getElementById("review-notes").value;
    b.status = "approved";
    b.approvedAt = todayISO();
    sendSMS(b.phone, `Your payment of ${money(b.total)} has been accepted. We're finalising your booking now.`);
    persist();
    render();
  }
  function rejectPayment(id){
    const b = state.bookings.find(x=>x.id===id);
    b.notes = document.getElementById("review-notes").value;
    b.status = "rejected";
    sendSMS(b.phone, `We couldn't verify your payment screenshot. Please re-upload a clear receipt or contact the front desk.`);
    persist();
    render();
  }
  function confirmStay(id){
    const b = state.bookings.find(x=>x.id===id);
    b.status = "confirmed";
    const r = roomById(b.roomId);
    if(r) r.status = "occupied";
    sendSMS(b.phone, `Receipt generated. Your stay at ${r?r.name:''} is confirmed: ${fmtDate(b.checkIn)} to ${fmtDate(b.checkOut)}. Welcome!`);
    persist();
    render();
  }
  function emailReceipt(id){
    const b = state.bookings.find(x=>x.id===id);
    alert("Receipt emailed to " + (b.email || "guest") + " (simulated — connect an email service to send for real).");
  }

  /* ---------------------------------------------------------
     MANAGER: RESIDENTS
  --------------------------------------------------------- */
  function pageMgrResidents(){
    const residents = state.bookings.filter(b=>b.status==="confirmed");
    return managerShell(`
      <h2>Resident management</h2>
      <div class="mgr-sub">Everyone currently checked in.</div>
      <div class="table-wrap">
        <table>
          <tr><th>Resident</th><th>Room</th><th>Check-out</th><th>Payment status</th></tr>
          ${residents.length ? residents.map(b=>{
            const r = roomById(b.roomId);
            return `<tr><td>${b.guestName}</td><td>${r?r.name:''}</td><td>${fmtDate(b.checkOut)}</td><td><span class="status-pill status-confirmed">Paid</span></td></tr>`;
          }).join("") : `<tr><td colspan="4" class="empty">No current residents yet.</td></tr>`}
        </table>
      </div>
    `);
  }

  /* ---------------------------------------------------------
     MANAGER: CUSTOMERS
  --------------------------------------------------------- */
  function pageMgrCustomers(){
    const byPhone = {};
    state.bookings.forEach(b=>{
      if(!byPhone[b.phone]) byPhone[b.phone] = {name:b.guestName, phone:b.phone, email:b.email, count:0, lastRoom:""};
      byPhone[b.phone].count++;
      byPhone[b.phone].lastRoom = roomById(b.roomId)?.name || "";
    });
    const list = Object.values(byPhone);
    return managerShell(`
      <h2>Customer management</h2>
      <div class="mgr-sub">Guest history across all bookings.</div>
      <div class="table-wrap">
        <table>
          <tr><th>Name</th><th>Phone</th><th>Email</th><th>Bookings</th><th>Last room</th></tr>
          ${list.length ? list.map(c=>`
            <tr><td>${c.name}${c.count>1?'<span class="badge-flag">repeat</span>':''}</td><td>${c.phone}</td><td>${c.email||'—'}</td><td>${c.count}</td><td>${c.lastRoom}</td></tr>
          `).join("") : `<tr><td colspan="5" class="empty">No customers yet.</td></tr>`}
        </table>
      </div>
    `);
  }

  /* ---------------------------------------------------------
     MANAGER: NOTIFICATIONS LOG
  --------------------------------------------------------- */
  function pageMgrNotifications(){
    return managerShell(`
      <h2>Notifications &amp; alerts</h2>
      <div class="mgr-sub">Simulated SMS log — in a live deployment this connects to an SMS gateway (e.g. Hubtel, Twilio).</div>
      <div class="card">
        <div class="sms-log">
          ${state.smsLog.length ? state.smsLog.map(s=>`
            <div class="sms-item"><b>TO ${s.to} · ${new Date(s.at).toLocaleString()}</b>${s.body}</div>
          `).join("") : `<div class="empty">No messages sent yet.</div>`}
        </div>
      </div>
    `);
  }

  /* ---------------------------------------------------------
     RENDER / ROUTER TABLE
  --------------------------------------------------------- */
  function render(){
    const app = document.getElementById("app");
    let body = "";
    if(route.portal === "manager" && !managerAuthed && route.page !== "login"){
      route.page = "login";
    }
    switch(route.page){
      case "home": body = pageHome(); break;
      case "rooms": body = pageRooms(); break;
      case "room": body = pageRoomDetail(route.params.id); break;
      case "location": body = pageLocation(); break;
      case "booking": body = pageBooking(route.params.id); break;
      case "payment": body = pagePayment(route.params.id); break;
      case "status": body = pageStatus(route.params.id); break;
      case "login": body = pageManagerLogin(); break;
      case "dashboard": body = pageDashboard(); break;
      case "mgr-location": body = pageMgrLocation(); break;
      case "mgr-rooms": body = pageMgrRooms(); break;
      case "mgr-bookings": body = pageMgrBookings(); break;
      case "mgr-residents": body = pageMgrResidents(); break;
      case "mgr-customers": body = pageMgrCustomers(); break;
      case "mgr-notifications": body = pageMgrNotifications(); break;
      default: body = pageHome();
    }
    const foot = route.portal === "guest" ? renderFooter() : "";
    app.innerHTML = `<div class="scroll-progress" id="scroll-progress"></div>` + topbar() + `<div id="page-content">` + body + foot + `</div>`;

    syncOnScroll();
    setupReveals();
    animateCounters();
    setupTilt();

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const pc = document.getElementById("page-content");
        if(pc) pc.classList.add("page-fade-in");
      });
    });
  }

  /* ---- scroll-driven topbar, progress bar, hero parallax ---- */
  function syncOnScroll(){
    const y = window.scrollY;
    const tb = document.querySelector(".topbar");
    if(tb) tb.classList.toggle("scrolled", y > 8);

    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    const bar = document.getElementById("scroll-progress");
    if(bar) bar.style.width = (max > 0 ? Math.min(100, (y / max) * 100) : 0) + "%";

    const heroWrap = document.querySelector(".hero-panel");
    if(heroWrap){
      if(y < 480){
        heroWrap.style.transform = `translateY(${(y * 0.18).toFixed(1)}px)`;
        heroWrap.style.opacity = Math.max(1 - y / 420, 0).toFixed(2);
      } else {
        heroWrap.style.opacity = "0";
      }
    }
  }
  window.addEventListener("scroll", syncOnScroll, {passive:true});
  window.addEventListener("resize", syncOnScroll);

  /* ---- reveal-on-scroll (plays the transition even for content already on screen) ---- */
  let revealObserver = null;
  function setupReveals(){
    if(revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add("in-view");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});

    const els = document.querySelectorAll(".reveal, .reveal-scale");
    const inViewport = [], offscreen = [];
    els.forEach(el=>{
      const rect = el.getBoundingClientRect();
      (rect.top < window.innerHeight && rect.bottom > 0 ? inViewport : offscreen).push(el);
    });
    offscreen.forEach(el => revealObserver.observe(el));
    // force a layout flush, then reveal on-screen elements next frame so the transition actually plays
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        inViewport.forEach(el => el.classList.add("in-view"));
      });
    });
  }

  /* ---- subtle 3D tilt on room cards, following the cursor ---- */
  let tiltBound = false;
  function setupTilt(){
    if(tiltBound) return;
    tiltBound = true;
    let activeCard = null;
    document.addEventListener("mousemove", (e)=>{
      const card = e.target.closest ? e.target.closest(".room-card") : null;
      if(card !== activeCard && activeCard){
        activeCard.style.transform = "";
      }
      activeCard = card;
      if(!card) return;
      const rect = card.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width - 0.5;
      const relY = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `perspective(700px) rotateX(${(-relY * 5).toFixed(2)}deg) rotateY(${(relX * 7).toFixed(2)}deg) translateY(-4px)`;
    }, {passive:true});
    document.addEventListener("mouseleave", ()=>{
      if(activeCard){ activeCard.style.transform = ""; activeCard = null; }
    }, true);
  }

  /* ---- animated number counters ---- */
  function animateCounters(){
    document.querySelectorAll("[data-count]").forEach(el=>{
      const target = Number(el.dataset.count);
      if(isNaN(target)) return;
      const suffix = el.dataset.suffix || "";
      const duration = 650;
      const startTime = performance.now();
      function step(now){
        const p = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(eased * target).toLocaleString() + suffix;
        if(p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ---------------------------------------------------------
     PUBLIC API
  --------------------------------------------------------- */
  function scrollCarousel(dir){
    const el = document.getElementById("featured-carousel");
    if(!el) return;
    el.scrollBy({left: dir * 290, behavior: "smooth"});
  }

  window.App = {
    go, goPortal, startBooking, updateDraft, submitBooking,
    payWithMomo, uploadReceipt, lookupBooking,
    tryLogin, logoutManager,
    addLandmark, updateLandmark, saveLocation,
    newRoom, editRoom, toggleRoomStatus, closeRoomEditor, previewRoomPhoto, saveRoom,
    setBookingFilter, openBookingReview, closeBookingReview, approvePayment, rejectPayment, confirmStay, emailReceipt,
    scrollCarousel
  };

  render();
})();
</script>
